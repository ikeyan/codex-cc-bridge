version: 2
updates:
  # cooldown は .npmrc / Dockerfile 等の min-release-age と揃える (揃っていないと
  # 待機期間内の版を提案した PR で npm ci が ETARGET で落ちる)。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  # wiki/ ツール (plasma-wiki) の pyproject.toml + uv.lock。
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
