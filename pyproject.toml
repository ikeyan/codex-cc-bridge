# plasma-wiki だけのための dev 依存宣言。このリポジトリに Python の成果物は無く、
# wiki/ の index 生成 (`wiki update`) と検査 (`wiki lint`) を lockfile で固定するためだけに置く。
# 実行は `uv run --frozen wiki ...` (uv.lock どおり = ハッシュ固定)。更新は Dependabot の uv ecosystem。
[project]
name = "codex-cc-bridge-wiki-tools"
version = "0"
requires-python = ">=3.12"

# 配布物ではないので build backend を要求しない (uv は仮想プロジェクトとして扱う)。
[tool.uv]
package = false

[dependency-groups]
dev = ["plasma-wiki==1.3.1"]
